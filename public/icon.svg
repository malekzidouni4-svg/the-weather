<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b2d" />
      <stop offset="50%" stop-color="#163756" />
      <stop offset="100%" stop-color="#2a5f82" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d6e6f2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle radius -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer subtle glass ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Glowing Sun -->
  <circle cx="310" cy="205" r="75" fill="url(#sun)" filter="url(#glow)" />
  
  <!-- Atmos Logo Glyphs -->
  <g filter="drop-shadow(0 14px 28px rgba(0,0,0,0.35))">
    <!-- Cloud shape -->
    <path d="M190 355 h180 a55 55 0 0 0 10 -109 a80 80 0 0 0 -150 -26 a65 65 0 0 0 -40 135 z" fill="url(#cloud)" />
  </g>
  
  <!-- Brand Crescent Arc "◒" -->
  <circle cx="160" cy="180" r="28" fill="none" stroke="#a9e7ff" stroke-width="8" stroke-dasharray="110 30" opacity="0.8" />
</svg>
