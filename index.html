    <script>
      // Protection against third-party extension interceptors trying to write to getter-only window.fetch
      try {
        var proto = window;
        while (proto && !Object.prototype.hasOwnProperty.call(proto, 'fetch')) {
          proto = Object.getPrototypeOf(proto);
        }
        var desc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : null;
        if (desc && desc.get && !desc.set) {
          var realFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return realFetch;
            },
            set: function (newFn) {
              realFetch = newFn;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Safe fallback
      }

      // Safeguard for disabled HMR environments where Vite client WebSocket is intentionally absent
      window.addEventListener('error', function (event) {
        if (event && event.message && (event.message.includes("reading 'send'") || event.message.includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && event.reason.message && event.reason.message.includes("reading 'send'")) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
